<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI早报 - {{DATE_CN}}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --border-hover: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.06);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 36px 20px 64px;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 32px 26px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      flex-shrink: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .summary-lead {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .overview-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .stat-pill {
      font-size: 12.5px;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      padding: 6px 15px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #ffffff;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px 28px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .card.hidden {
      display: none;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .index-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .tag-industry { background: #eff6ff; color: #1d4ed8; }
    .tag-model { background: #f0fdf4; color: #15803d; }
    .tag-research { background: #f5f3ff; color: #6d28d9; }
    .tag-github { background: #fff7ed; color: #c2410c; }
    .tag-tool { background: #ecfeff; color: #0e7490; }

    .source-label {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .section-block {
      margin-bottom: 14px;
    }

    .section-label {
      display: inline-block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .section-text {
      font-size: 14.8px;
      color: var(--text-secondary);
      line-height: 1.75;
    }

    .value-box {
      background: var(--surface-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 12px 16px;
      margin-bottom: 18px;
    }

    .value-box .section-label {
      color: #1d4ed8;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--accent-soft);
      transition: background 0.16s ease, color 0.16s ease;
    }

    .link-btn:hover {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .link-domain {
      font-size: 12.5px;
      color: var(--text-muted);
      word-break: break-all;
    }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      body { padding: 20px 14px 44px; }
      .header-card { padding: 22px 20px 20px; }
      h1 { font-size: 23px; }
      .card { padding: 20px 18px; }
      .card-title { font-size: 17.5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-card">
      <div class="header-top">
        <div class="brand-row">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1>AI 早报</h1>
        </div>
        <div class="date-badge">{{DATE_CN}} · {{WEEKDAY_CN}}</div>
      </div>
      <p class="summary-lead">{{SUMMARY_LEAD}}</p>
      <div class="overview-stats">
        <span class="stat-pill">精选条目：<strong>{{ITEM_COUNT}} 条</strong></span>
        <span class="stat-pill">覆盖范围：<strong>AI 前沿动态 + GitHub Trending</strong></span>
        <span class="stat-pill">更新频率：<strong>每日 08:30 自动生成</strong></span>
      </div>
    </header>

    <nav class="filter-bar" aria-label="按分类筛选">
      {{FILTER_BUTTONS}}
    </nav>

    <main class="cards">
      {{CARDS_HTML}}
    </main>

    <footer>
      AI 早报 · 生成于 {{DATE_ISO}} · 单文件离线可读，点击卡片底部链接即可直达原始来源
    </footer>
  </div>

  <script>
    (function () {
      const buttons = document.querySelectorAll('.filter-btn');
      const cards = document.querySelectorAll('.card');

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          buttons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');

          const filter = btn.getAttribute('data-filter');
          cards.forEach((card) => {
            if (filter === 'all' || card.getAttribute('data-category') === filter) {
              card.classList.remove('hidden');
            } else {
              card.classList.add('hidden');
            }
          });
        });
      });
    })();
  </script>
</body>
</html>
