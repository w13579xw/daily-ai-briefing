<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI早报 - {{DATE_CN}}</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --surface-subtle: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border: rgba(148, 163, 184, 0.24);
      --border-hover: rgba(99, 102, 241, 0.42);
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius-lg: 16px;
      --radius-md: 11px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 75% 42% at 15% -5%, rgba(99, 102, 241, 0.14), transparent 60%),
        radial-gradient(ellipse 65% 40% at 88% 0%, rgba(14, 165, 233, 0.13), transparent 58%),
        radial-gradient(rgba(148, 163, 184, 0.22) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 22px 22px;
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding: 18px 20px 36px;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* 炫酷毛玻璃顶部概览条 */
    .header-card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 18px 24px 16px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      margin-bottom: 18px;
    }

    .header-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981, #f97316, #4f46e5);
      background-size: 220% 100%;
      animation: gradientFlow 8s linear infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-pulse {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16); }
      50% { box-shadow: 0 0 0 7px rgba(6, 182, 212, 0.12); }
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(241, 245, 249, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .overview-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(248, 250, 252, 0.95);
      border: 1px solid var(--border);
      padding: 3px 11px;
      border-radius: var(--radius-pill);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .summary-lead {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* 分区标题栏 */
    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 12px;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-accent-bar {
      width: 4px;
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(180deg, #4f46e5, #06b6d4);
    }

    .section-bar h2 {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
    }

    /* ===== 上方板块：三行横向科研公众号轨道 ===== */
    .media-rows {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .media-row {
      display: grid;
      grid-template-columns: 144px minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-lg);
      padding: 10px;
      box-shadow: var(--shadow-sm);
    }

    .media-brand {
      border-radius: 12px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .media-brand::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.24), transparent 60%);
      pointer-events: none;
    }

    .brand-xzy {
      background: linear-gradient(145deg, #4338ca 0%, #6366f1 55%, #3b82f6 100%);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.24);
    }

    .brand-qbit {
      background: linear-gradient(145deg, #047857 0%, #10b981 55%, #06b6d4 100%);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.24);
    }

    .brand-jqzx {
      background: linear-gradient(145deg, #c2410c 0%, #ea580c 55%, #e11d48 100%);
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.24);
    }

    .media-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .media-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .media-sub {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 500;
    }

    .media-count {
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 9px;
      border-radius: var(--radius-pill);
    }

    .media-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .wechat-card {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .wechat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .row-xzy .wechat-card:hover { border-color: rgba(99, 102, 241, 0.5); }
    .row-qbit .wechat-card:hover { border-color: rgba(16, 185, 129, 0.5); }
    .row-jqzx .wechat-card:hover { border-color: rgba(234, 88, 12, 0.5); }

    .wechat-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .wechat-summary {
      font-size: 12.4px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 10px;
      flex: 1;
    }

    /* ===== 下方板块：前沿动态与 GitHub 热门 ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cards-grid.has-featured .card:first-child:not(.hidden) {
      grid-column: span 2;
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .card.hidden {
      display: none;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .index-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .tag-industry { background: #eff6ff; color: #1d4ed8; }
    .tag-model { background: #f0fdf4; color: #15803d; }
    .tag-research { background: #f5f3ff; color: #6d28d9; }
    .tag-github { background: #fff7ed; color: #c2410c; }
    .tag-tool { background: #ecfeff; color: #0e7490; }

    .source-label {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .inline-label {
      font-weight: 700;
      color: var(--text-primary);
      margin-right: 4px;
    }

    .value-box {
      background: linear-gradient(90deg, rgba(239, 246, 255, 0.85), rgba(248, 250, 252, 0.85));
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 8px 11px;
    }

    .value-box .inline-label {
      color: #1d4ed8;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 9px;
      border-top: 1px dashed rgba(148, 163, 184, 0.32);
      margin-top: auto;
    }

    .link-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 7px;
      background: var(--accent-soft);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .link-btn:hover {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .wx-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.8px;
      font-weight: 600;
      color: #047857;
      text-decoration: none;
      padding: 3.5px 9px;
      border-radius: 7px;
      background: #ecfdf5;
      border: 1px solid rgba(16, 185, 129, 0.25);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .wx-btn:hover {
      background: #d1fae5;
      color: #065f46;
    }

    .resource-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 3.5px 8.5px;
      border-radius: 7px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .resource-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
      background: #f1f5f9;
    }

    .link-domain {
      font-size: 11.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 1040px) {
      .media-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      body { padding: 14px 12px 28px; }
      .media-row {
        grid-template-columns: 1fr;
      }
      .media-brand {
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
        padding: 10px 14px;
      }
      .media-count {
        margin-left: auto;
      }
      .media-cards,
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .cards-grid.has-featured .card:first-child:not(.hidden) {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-card">
      <div class="header-top">
        <div class="brand-row">
          <span class="brand-pulse" aria-hidden="true"></span>
          <h1>AI 早报</h1>
          <span class="date-badge">{{DATE_CN}} · {{WEEKDAY_CN}}</span>
        </div>
        <div class="overview-stats">
          <span class="stat-pill">科研公众号 <strong>{{WECHAT_COUNT}}</strong></span>
          <span class="stat-pill">前沿 &amp; GitHub <strong>{{ITEM_COUNT}}</strong></span>
          <span class="stat-pill">每日 08:30 自动更新</span>
        </div>
      </div>
      <p class="summary-lead">{{SUMMARY_LEAD}}</p>
    </header>

    {{WECHAT_SECTION_HTML}}

    <div class="section-bar">
      <div class="section-title-wrap">
        <span class="section-accent-bar" aria-hidden="true"></span>
        <h2>前沿动态与 GitHub 热门</h2>
      </div>
      <nav class="filter-bar" data-group="main" aria-label="按分类筛选">
        {{FILTER_BUTTONS}}
      </nav>
    </div>

    <main class="cards-grid {{MAIN_GRID_CLASS}}" id="main-grid">
      {{CARDS_HTML}}
    </main>

    <footer>
      AI 早报 · {{DATE_ISO}}
    </footer>
  </div>

  <script>
    (function () {
      const nav = document.querySelector('.filter-bar[data-group="main"]');
      const grid = document.getElementById('main-grid');
      if (!nav || !grid) return;

      const buttons = nav.querySelectorAll('.filter-btn');
      const cards = grid.querySelectorAll('.card');

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          buttons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');

          const filter = btn.getAttribute('data-filter');
          cards.forEach((card) => {
            if (filter === 'all' || card.getAttribute('data-category') === filter) {
              card.classList.remove('hidden');
            } else {
              card.classList.add('hidden');
            }
          });

          const visibleCount = grid.querySelectorAll('.card:not(.hidden)').length;
          grid.classList.toggle('has-featured', filter === 'all' && visibleCount % 2 === 1);
        });
      });
    })();
  </script>
</body>
</html>
