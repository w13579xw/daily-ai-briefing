<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI早报 - {{DATE_CN}}</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --border-hover: #cbd5e1;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.06);
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding: 18px 20px 36px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* 紧凑顶部概览条 */
    .header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      flex-shrink: 0;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 3px 11px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .overview-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .summary-lead {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* 分区标题与右侧筛选条合并为一行 */
    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 12px;
    }

    .section-bar h2 {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--text-primary);
      border-color: var(--text-primary);
      color: #ffffff;
    }

    /* 板块一：2列紧凑网格（首条在全览时跨2列） */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cards-grid.has-featured .card:first-child:not(.hidden) {
      grid-column: span 2;
    }

    /* 板块二：3列紧凑网格 */
    .wechat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .card.hidden {
      display: none;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .index-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .tag-industry { background: #eff6ff; color: #1d4ed8; }
    .tag-model { background: #f0fdf4; color: #15803d; }
    .tag-research { background: #f5f3ff; color: #6d28d9; }
    .tag-github { background: #fff7ed; color: #c2410c; }
    .tag-tool { background: #ecfeff; color: #0e7490; }

    .media-xzy { background: #eef2ff; color: #4338ca; }
    .media-qbit { background: #ecfdf5; color: #047857; }
    .media-jqzx { background: #fffbeb; color: #b45309; }
    .media-other { background: #f3f4f6; color: #374151; }

    .source-label {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .inline-label {
      font-weight: 700;
      color: var(--text-primary);
      margin-right: 4px;
    }

    .value-box {
      background: var(--surface-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 8px 11px;
    }

    .value-box .inline-label {
      color: #1d4ed8;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      margin-top: auto;
    }

    .link-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 7px;
      background: var(--accent-soft);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .link-btn:hover {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .resource-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 3.5px 9px;
      border-radius: 7px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .resource-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
      background: #f1f5f9;
    }

    .link-domain {
      font-size: 11.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    .wechat-section {
      margin-top: 22px;
    }

    .wechat-card {
      padding: 14px 16px;
    }

    .wechat-card .card-title {
      font-size: 14.5px;
      margin-bottom: 7px;
    }

    .wechat-card .section-text {
      font-size: 12.6px;
      line-height: 1.55;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (max-width: 1024px) {
      .wechat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      body { padding: 14px 12px 28px; }
      .cards-grid,
      .wechat-grid {
        grid-template-columns: 1fr;
      }
      .cards-grid.has-featured .card:first-child:not(.hidden) {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-card">
      <div class="header-top">
        <div class="brand-row">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1>AI 早报</h1>
          <span class="date-badge">{{DATE_CN}} · {{WEEKDAY_CN}}</span>
        </div>
        <div class="overview-stats">
          <span class="stat-pill">前沿 &amp; GitHub <strong>{{ITEM_COUNT}}</strong></span>
          <span class="stat-pill">科研公众号 <strong>{{WECHAT_COUNT}}</strong></span>
          <span class="stat-pill">每日 08:30 自动更新</span>
        </div>
      </div>
      <p class="summary-lead">{{SUMMARY_LEAD}}</p>
    </header>

    <div class="section-bar">
      <h2>前沿动态与 GitHub 热门</h2>
      <nav class="filter-bar" data-group="main" aria-label="按分类筛选">
        {{FILTER_BUTTONS}}
      </nav>
    </div>

    <main class="cards-grid {{MAIN_GRID_CLASS}}" id="main-grid">
      {{CARDS_HTML}}
    </main>

    {{WECHAT_SECTION_HTML}}

    <footer>
      AI 早报 · {{DATE_ISO}}
    </footer>
  </div>

  <script>
    (function () {
      function setupFilter(navSelector, gridId, attrName, toggleFeatured) {
        const nav = document.querySelector(navSelector);
        const grid = document.getElementById(gridId);
        if (!nav || !grid) return;

        const buttons = nav.querySelectorAll('.filter-btn');
        const cards = grid.querySelectorAll('.card');

        buttons.forEach((btn) => {
          btn.addEventListener('click', () => {
            buttons.forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');

            const filter = btn.getAttribute('data-filter');
            cards.forEach((card) => {
              if (filter === 'all' || card.getAttribute(attrName) === filter) {
                card.classList.remove('hidden');
              } else {
                card.classList.add('hidden');
              }
            });

            if (toggleFeatured) {
              const visibleCount = grid.querySelectorAll('.card:not(.hidden)').length;
              grid.classList.toggle('has-featured', filter === 'all' && visibleCount % 2 === 1);
            }
          });
        });
      }

      setupFilter('.filter-bar[data-group="main"]', 'main-grid', 'data-category', true);
      setupFilter('.filter-bar[data-group="wechat"]', 'wechat-grid', 'data-media', false);
    })();
  </script>
</body>
</html>
